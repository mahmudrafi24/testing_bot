<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; background: #f3f6f3; color: #172b20; font: 1rem/1.55 system-ui, sans-serif }
    main { width: min(100% - 2rem, 56rem); margin: clamp(2rem, 9vw, 6rem) auto }
    h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); margin: 0 0 1.5rem; line-height: 1 }
    ul { padding: 0; list-style: none; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)) }
    a { display: block; border: 1px solid #d3e0d5; border-radius: .85rem; padding: 1.4rem; background: white; color: #205538; text-underline-offset: .2em }
    a:hover { border-color: #205538 }
    strong { font-size: 1.2rem }
    p { margin: .55rem 0 0 }
  </style>
</head>
<body>
  <main>
    <h1>Projects</h1>
    <ul>
      <li><a href="./leipzig-jobs/"><strong>Leipzig Student Jobs</strong></a>
      <p>Browse minijobs, casual shifts, and working-student positions in Leipzig.</p></li>
    </ul>
  </main>
</body>
</html>
